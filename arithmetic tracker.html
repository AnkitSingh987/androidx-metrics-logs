<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RRB PO & Clerk - Arithmetic Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .progress-bar-fill { transition: width 0.3s ease; }
        .checkbox-custom {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .checkbox-custom:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .checkbox-custom:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="bg-blue-600 text-white rounded-xl p-6 mb-8 shadow-lg flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold mb-2">Arithmetic 2x Speed Tracker</h1>
                <p class="text-blue-100">RRB PO + Clerk Target • Total 135 Videos • 67h 30m</p>
            </div>
            <div class="mt-4 md:mt-0">
                <a href="https://examtune.com/new-courses/180/content?activeTab=Content" target="_blank" class="bg-white text-blue-600 px-6 py-3 rounded-lg font-bold shadow hover:bg-gray-100 transition inline-flex items-center gap-2">
                    <i class="fas fa-external-link-alt"></i> Go to Class
                </a>
            </div>
        </header>

        <!-- Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-xl p-6 shadow">
                <h3 class="text-gray-500 font-semibold mb-1">Overall Progress</h3>
                <div class="text-3xl font-bold text-gray-800 mb-2" id="overall-percentage">0%</div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div class="bg-green-500 h-2.5 rounded-full progress-bar-fill" id="overall-progress-bar" style="width: 0%"></div>
                </div>
                <p class="text-sm text-gray-500 mt-2"><span id="completed-videos">0</span> / 135 Videos Completed</p>
            </div>
            <div class="bg-white rounded-xl p-6 shadow">
                <h3 class="text-gray-500 font-semibold mb-1">Total Time Watched</h3>
                <div class="text-3xl font-bold text-blue-600 mb-2" id="time-watched">0m</div>
                <p class="text-sm text-gray-500">Out of 4050 mins (67h 30m at 2x)</p>
            </div>
            <div class="bg-white rounded-xl p-6 shadow bg-gradient-to-br from-yellow-50 to-orange-50 border border-yellow-100">
                <h3 class="text-yellow-700 font-semibold mb-1"><i class="fas fa-trophy text-yellow-500"></i> Daily Best (Mins)</h3>
                <div class="text-3xl font-bold text-gray-800 mb-2" id="daily-best-time">0m</div>
                <p class="text-sm text-gray-500 mb-3">Log your daily study time!</p>
                <div class="flex gap-2">
                    <input type="number" id="daily-log-input" placeholder="Mins" class="w-20 px-3 py-1 border rounded focus:outline-none focus:border-yellow-500">
                    <button onclick="logDailyTime()" class="bg-yellow-500 text-white px-3 py-1 rounded font-semibold hover:bg-yellow-600 transition">Log Today</button>
                </div>
            </div>
        </div>

        <!-- Chapters -->
        <h2 class="text-2xl font-bold mb-4">Chapter-wise Tracker</h2>
        <div id="chapters-container" class="space-y-4">
            <!-- Rendered via JS -->
        </div>
    </div>

    <script>
        const chapters = [
            { id: 12, name: "Ratio & Proportions", videos: 7, time: 210 },
            { id: 13, name: "Percentage & Its Applications", videos: 7, time: 210 },
            { id: 14, name: "Profit and Loss Discount", videos: 7, time: 210 },
            { id: 15, name: "Simple Interest Concepts", videos: 4, time: 120 },
            { id: 16, name: "Compound Interest Concepts", videos: 6, time: 180 },
            { id: 17, name: "Mixture Replacement Alligation", videos: 5, time: 150 },
            { id: 18, name: "Partnership Concepts", videos: 4, time: 120 },
            { id: 19, name: "Problems on Age", videos: 2, time: 60 },
            { id: 20, name: "Problems on Average", videos: 5, time: 150 },
            { id: 21, name: "Time and Work", videos: 8, time: 240 },
            { id: 22, name: "Pipe and Cistern", videos: 4, time: 120 },
            { id: 23, name: "Speed Time & Distance", videos: 6, time: 180 },
            { id: 24, name: "Problems on Train", videos: 2, time: 60 },
            { id: 25, name: "Boat and Stream", videos: 2, time: 60 },
            { id: 26, name: "Mensuration 2D Area & Perimeter", videos: 4, time: 120 },
            { id: 27, name: "Mensuration 3D (Volume & Surface Area)", videos: 3, time: 90 },
            { id: 28, name: "Permutation & Combinations", videos: 4, time: 120 },
            { id: 29, name: "Probability Concepts", videos: 5, time: 150 },
            { id: 30, name: "Data Interpretations Foundations", videos: 50, time: 1500 },
        ];

        let state = JSON.parse(localStorage.getItem('arithmeticTrackerState')) || {};
        let dailyLogs = JSON.parse(localStorage.getItem('arithmeticDailyLogs')) || {};

        function saveState() {
            localStorage.setItem('arithmeticTrackerState', JSON.stringify(state));
        }

        function saveDailyLogs() {
            localStorage.setItem('arithmeticDailyLogs', JSON.stringify(dailyLogs));
            updateDashboard();
        }

        function toggleVideo(chapterId, videoIndex) {
            const key = `${chapterId}-${videoIndex}`;
            state[key] = !state[key];
            saveState();
            updateDashboard();
            updateChapterProgress(chapterId);
        }

        function logDailyTime() {
            const input = document.getElementById('daily-log-input');
            const mins = parseInt(input.value);
            if (isNaN(mins) || mins <= 0) return;

            const today = new Date().toISOString().split('T')[0];
            dailyLogs[today] = (dailyLogs[today] || 0) + mins;
            saveDailyLogs();
            input.value = '';
            alert(`Logged ${mins} minutes for today! Total today: ${dailyLogs[today]}m`);
        }

        function updateDashboard() {
            let completed = 0;
            let timeWatched = 0;

            chapters.forEach(ch => {
                const timePerVideo = ch.time / ch.videos;
                for (let i = 0; i < ch.videos; i++) {
                    if (state[`${ch.id}-${i}`]) {
                        completed++;
                        timeWatched += timePerVideo;
                    }
                }
            });

            const totalVideos = 135;
            const percentage = ((completed / totalVideos) * 100).toFixed(1);
            
            document.getElementById('overall-percentage').innerText = `${percentage}%`;
            document.getElementById('overall-progress-bar').style.width = `${percentage}%`;
            document.getElementById('completed-videos').innerText = completed;
            
            const hours = Math.floor(timeWatched / 60);
            const mins = Math.floor(timeWatched % 60);
            document.getElementById('time-watched').innerText = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;

            // Calculate daily best
            let best = 0;
            for (let date in dailyLogs) {
                if (dailyLogs[date] > best) best = dailyLogs[date];
            }
            const bHours = Math.floor(best / 60);
            const bMins = best % 60;
            document.getElementById('daily-best-time').innerText = bHours > 0 ? `${bHours}h ${bMins}m` : `${bMins}m`;
        }

        function updateChapterProgress(chapterId) {
            const ch = chapters.find(c => c.id === chapterId);
            let comp = 0;
            for (let i = 0; i < ch.videos; i++) {
                if (state[`${ch.id}-${i}`]) comp++;
            }
            document.getElementById(`ch-${chapterId}-count`).innerText = `${comp}/${ch.videos}`;
            
            const pBar = document.getElementById(`ch-${chapterId}-progress`);
            pBar.style.width = `${(comp/ch.videos)*100}%`;
            
            if (comp === ch.videos) {
                pBar.classList.remove('bg-blue-500');
                pBar.classList.add('bg-green-500');
            } else {
                pBar.classList.remove('bg-green-500');
                pBar.classList.add('bg-blue-500');
            }
        }

        function renderChapters() {
            const container = document.getElementById('chapters-container');
            container.innerHTML = '';

            chapters.forEach(ch => {
                let checkboxesHtml = '';
                let comp = 0;
                for (let i = 0; i < ch.videos; i++) {
                    const isChecked = state[`${ch.id}-${i}`] ? 'checked' : '';
                    if (isChecked) comp++;
                    checkboxesHtml += `
                        <label class="flex flex-col items-center gap-1">
                            <input type="checkbox" class="checkbox-custom" ${isChecked} onchange="toggleVideo(${ch.id}, ${i})">
                            <span class="text-xs text-gray-500">V${i+1}</span>
                        </label>
                    `;
                }

                const timePerVideo = ch.time / ch.videos;

                const chapterEl = document.createElement('div');
                chapterEl.className = 'bg-white rounded-xl p-5 shadow flex flex-col md:flex-row gap-6 items-start md:items-center';
                chapterEl.innerHTML = `
                    <div class="md:w-1/3 w-full">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-gray-800">Ch ${ch.id}: ${ch.name}</h3>
                            <span class="text-sm font-semibold text-gray-500" id="ch-${ch.id}-count">${comp}/${ch.videos}</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-1.5 mb-2">
                            <div class="bg-${comp === ch.videos ? 'green' : 'blue'}-500 h-1.5 rounded-full progress-bar-fill" id="ch-${ch.id}-progress" style="width: ${(comp/ch.videos)*100}%"></div>
                        </div>
                        <p class="text-xs text-gray-500"><i class="far fa-clock"></i> ${timePerVideo}m per video @ 2x (Total ${ch.time}m)</p>
                    </div>
                    <div class="md:w-2/3 w-full flex flex-wrap gap-4">
                        ${checkboxesHtml}
                    </div>
                `;
                container.appendChild(chapterEl);
            });
        }

        // Init
        renderChapters();
        updateDashboard();
    </script>
</body>
</html>
